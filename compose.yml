name: inference

x-tei: &tei
  image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-86-1.9.1}
  restart: unless-stopped
  # The router discovers every labelled container as a backend.
  labels:
    - tei.backend=1
  environment:
    HUGGINGFACE_HUB_CACHE: /data
  volumes:
    - ${HF_CACHE:-$HOME/.hf-cache}:/data
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 600s

x-reranker: &reranker
    <<: *tei
    command:
      - --model-id
      - ${MODEL_RERANKER:-Alibaba-NLP/gte-reranker-modernbert-base}
      - --dtype
      - float16
      - --max-client-batch-size
      - "64"
      - --max-batch-tokens
      - "8192"

# voyage-4-nano is bf16 and needs vLLM — under TEI it returns
# NaN at fp16 and runs out of memory at fp32.
x-voyage: &voyage
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.16.0}
    restart: unless-stopped
    # The router discovers every labelled container as a backend.
    labels:
      - tei.backend=1
    # vLLM uses /dev/shm for its worker. The default of 64m is too small.
    ipc: host
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - ${HF_CACHE:-$HOME/.hf-cache}:/data
    # The vLLM image has python3 but not always curl. Nothing waits on this: the
    # router starts with the stack and serves what is routable. The check reports
    # the model load for the operator, and the wide start period stops it from
    # reporting a failure while the model loads.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    command:
      - --model
      - ${MODEL_VOYAGE_EMBED:-voyageai/voyage-4-nano}
      - --served-model-name
      - ${MODEL_VOYAGE_EMBED:-voyageai/voyage-4-nano}
      - --runner
      - pooling
      - --trust-remote-code
      - --hf-overrides
      - '{"architectures":["VoyageQwen3BidirectionalEmbedModel"]}'
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "${VOYAGE_GPU_MEMORY:-0.5}"
      - --enforce-eager
      - --port
      - "80"

services:
  router:
    build: ./router
    restart: unless-stopped
    environment:
      PORT: "80"
    ports:
      - "${ROUTER_PORT:-8100}:80"
    volumes:
      # Read-only. The router registers one entry for each labelled container,
      # which is how every backend is found: add a service to this file and it is
      # routable once its model answers. There is no second list to keep in step.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - reranker
      - voyage-embed

  reranker:
    <<: *reranker
    ports:
      - "${PORT_RERANKER:-8021}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_RERANKER:-0}"]
              capabilities: [gpu]

  reranker-b:
    <<: *reranker
    ports:
      - "${PORT_RERANKER_B:-8022}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_RERANKER_B:-1}"]
              capabilities: [gpu]

  voyage-embed:
    <<: *voyage
    ports:
      - "${PORT_VOYAGE_EMBED:-8001}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_VOYAGE_EMBED:-0}"]
              capabilities: [gpu]

  voyage-embed-b:
    <<: *voyage
    ports:
      - "${PORT_VOYAGE_EMBED_B:-8002}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_VOYAGE_EMBED_B:-1}"]
              capabilities: [gpu]

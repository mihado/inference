name: inference

# Seven Hugging Face Inference (TEI) slots on a 2x RTX A4000 box, fronted by a
# model-aware router. Slots 1-4 and 7 pin GPU 0 (rerankers), 5-6 pin GPU 1
# (embedders). Each mounts one shared host weight cache; the model per slot is an
# .env variable so scripts/model.sh (or `make load`) can swap it. See README.md.

x-tei: &tei
  image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-86-1.9.1}
  restart: unless-stopped
  # Discovered by the router: every labelled container is a backend.
  labels:
    - tei.backend=1
  environment:
    HUGGINGFACE_HUB_CACHE: /data
  volumes:
    - ${HF_CACHE:-$HOME/.hf-cache}:/data
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 600s

services:
  # One model-aware front for the slots: reports their union of models and
  # routes each call by the requested model. Point a single client provider at
  # this instead of one per slot. See router/index.mjs.
  router:
    build: ./router
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKENDS: "http://hf-1:80,http://hf-2:80,http://hf-3:80,http://hf-4:80,http://hf-5:80,http://hf-6:80,http://hf-7:80"
    ports:
      - "${ROUTER_PORT:-8100}:80"
    volumes:
      # Read-only: the router lists labelled containers to discover ad-hoc
      # slots (scripts/run.sh). Drop it to use the static BACKENDS list only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - hf-1
      - hf-2
      - hf-3
      - hf-4
      - hf-5
      - hf-6
      - hf-7

  hf-1:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_1:-Alibaba-NLP/gte-reranker-modernbert-base}
      - --dtype
      - float16
      - --max-client-batch-size
      - "128"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_1:-8080}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_1:-0}"]
              capabilities: [gpu]

  hf-2:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_2:-BAAI/bge-reranker-v2-m3}
      - --dtype
      - float16
      - --max-client-batch-size
      - "128"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_2:-8081}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_2:-0}"]
              capabilities: [gpu]

  hf-3:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_3:-cross-encoder/ms-marco-MiniLM-L6-v2}
      - --dtype
      - float16
      - --max-client-batch-size
      - "128"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_3:-8082}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_3:-0}"]
              capabilities: [gpu]

  hf-4:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_4:-Alibaba-NLP/gte-multilingual-reranker-base}
      - --dtype
      - float16
      - --max-client-batch-size
      - "128"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_4:-8083}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_4:-0}"]
              capabilities: [gpu]

  hf-5:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_5:-ibm-granite/granite-embedding-reranker-english-r2}
      - --dtype
      - float16
      - --max-client-batch-size
      - "128"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_5:-8084}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_5:-0}"]
              capabilities: [gpu]

  hf-6:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_6:-Qwen/Qwen3-Embedding-0.6B}
      - --dtype
      - float16
      - --max-client-batch-size
      - "128"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_6:-8085}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_6:-1}"]
              capabilities: [gpu]

  hf-7:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_7:-voyageai/voyage-4-nano}
      - --dtype
      - float32
      - --max-client-batch-size
      - "32"
      - --max-batch-tokens
      - "32768"
    ports:
      - "${PORT_7:-8086}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_7:-1}"]
              capabilities: [gpu]

name: inference

# Two model servers on a 2x RTX A4000 box, fronted by a model-aware router:
# one TEI reranker and one vLLM embedder (voyage-4-nano). Both use GPU 1, so
# GPU 0 stays free. One host weight cache is shared. The model of each service
# is an .env variable. See README.md.

x-tei: &tei
  image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-86-1.9.1}
  restart: unless-stopped
  # The router discovers every labelled container as a backend.
  labels:
    - tei.backend=1
  environment:
    HUGGINGFACE_HUB_CACHE: /data
  volumes:
    - ${HF_CACHE:-$HOME/.hf-cache}:/data
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 600s

services:
  # One front for both servers. It reports the union of their models and sends
  # each call to the server that has the requested model. Point one client
  # provider here. See router/index.mjs.
  router:
    build: ./router
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKENDS: "http://reranker:80,http://nano:80"
    ports:
      - "${ROUTER_PORT:-8100}:80"
    volumes:
      # Read-only. The router lists labelled containers, so a free ad-hoc slot
      # from scripts/run.sh is found with no restart. Remove this line to use
      # the static BACKENDS list only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - reranker
      - nano

  # The best free local reranker (see README, "Measured results"). A reranker
  # reads a query and 30 short passages, so --max-batch-tokens is the model
  # input limit, 8192, and much less than the old shared value of 32768.
  reranker:
    <<: *tei
    command:
      - --model-id
      - ${MODEL_RERANKER:-Alibaba-NLP/gte-reranker-modernbert-base}
      - --dtype
      - float16
      - --max-client-batch-size
      - "64"
      - --max-batch-tokens
      - "8192"
    ports:
      - "${PORT_RERANKER:-8080}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_RERANKER:-1}"]
              capabilities: [gpu]

  # voyage-4-nano is a bf16 model with custom bidirectional pooling. Under TEI
  # it returns NaN vectors at fp16 and runs out of memory at fp32. vLLM runs it
  # at its native bfloat16, so it needs its own runtime.
  nano:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.16.0}
    restart: unless-stopped
    # Same backend label: the router discovers it and dispatches by model id.
    labels:
      - tei.backend=1
    # vLLM uses /dev/shm for its worker. The default of 64m is too small.
    ipc: host
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - ${HF_CACHE:-$HOME/.hf-cache}:/data
    command:
      - --model
      - ${MODEL_NANO:-voyageai/voyage-4-nano}
      - --served-model-name
      - ${MODEL_NANO:-voyageai/voyage-4-nano}
      - --runner
      - pooling
      - --trust-remote-code
      - --hf-overrides
      - '{"architectures":["VoyageQwen3BidirectionalEmbedModel"]}'
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "${NANO_GPU_MEMORY:-0.5}"
      - --enforce-eager
      - --port
      - "80"
    ports:
      - "${PORT_NANO:-8086}:80"
    healthcheck:
      # The vLLM image has python3 but not always curl.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_NANO:-1}"]
              capabilities: [gpu]

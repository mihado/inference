name: inference

# The `jina-embed` profile: the Jina embeddings v3 model on its own Python
# runtime (jina-embed/), not TEI — it answers TEI's /info, so the router
# discovers it like any other backend, and /v1/embeddings forwards verbatim.
# Non-commercial weights (CC-BY-NC-4.0): local dev and eval only. Sibling to
# the `jina` reranker profile. See jina/README.md.
#
#   docker compose -f compose.yml -f jina-embed/compose.jina-embed.yml --profile jina-embed up -d --build
#   make up-jina-embed / make down-jina-embed

services:
  jina-embed:
    profiles: ["jina-embed"]
    build: ./jina-embed
    restart: unless-stopped
    labels:
      - tei.backend=1
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      JINA_EMBED_MODEL: ${MODEL_JINA_EMBED:-jinaai/jina-embeddings-v3}
      JINA_EMBED_DEVICE: ${JINA_EMBED_DEVICE:-}
      JINA_EMBED_MAX_TEXTS: ${JINA_EMBED_MAX_TEXTS:-64}
    volumes:
      - ${HF_CACHE:-$HOME/.hf-cache}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    ports:
      - "${PORT_JINA_EMBED:-8094}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_EXTRAS:-0}"]
              capabilities: [gpu]
